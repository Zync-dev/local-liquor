<svg xmlns="http://www.w3.org/2000/svg" width="67.7mm" height="99.1mm" viewBox="0 0 67.7 99.1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Local Liquor — Jordbær back label, 67.7 × 99.1 mm</title>
  <rect x="0" y="0" width="67.7" height="99.1" fill="#FFFFFF"></rect>
  <text x="6" y="10.2" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-weight="800" font-size="3.6" letter-spacing="-0.11" fill="#17150F">LOCAL LIQUOR</text>
  <text x="61.7" y="10.2" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="2" letter-spacing="0.3" fill="#6E6A62">JORDBÆR</text>
  <rect x="6" y="12.6" width="55.7" height="0.3" fill="#C0453C"></rect>
  <text x="6" y="20" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-size="2.6" fill="#2E2A25">Presset på danske jordbær fra sæsonens høst og</text>
  <text x="6" y="23.7" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-size="2.6" fill="#2E2A25">gæret langsomt i små hold. Uklar og tør.</text>
  <text x="6" y="27.4" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-size="2.6" fill="#2E2A25">Serveres kold, 8–10 °C.</text>
  <text x="6" y="32.3" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-style="italic" font-size="2.3" fill="#6E6A62">Pressed from Danish strawberries, slowly fermented</text>
  <text x="6" y="35.6" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-style="italic" font-size="2.3" fill="#6E6A62">in small batches. Dry, unfiltered. Serve chilled.</text>
  <rect x="6" y="41.4" width="55.7" height="0.25" fill="#E2DFD9"></rect>
  <text x="6" y="45.9" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="1.9" letter-spacing="0.28" fill="#9A958C">INGREDIENSER · INGREDIENTS</text>
  <text x="6" y="49.4" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-size="2.3" fill="#2E2A25">Jordbær, vand, sukker, gær. Indeholder sulfitter.</text>
  <text x="6" y="80" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="2.2" letter-spacing="0.18" fill="#17150F">750 ML</text>
  <text x="33.8" y="80" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="2.2" letter-spacing="0.18" fill="#17150F">13 % VOL.</text>
  <text x="61.7" y="80" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="2.2" letter-spacing="0.18" fill="#17150F">BATCH 04</text>
  <rect x="6" y="82.2" width="55.7" height="0.25" fill="#E2DFD9"></rect>
  <text x="6" y="86.2" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="1.9" letter-spacing="0.2" fill="#6E6A62">FREMSTILLET OG AFTAPPET AF</text>
  <text x="6" y="89.4" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="1.9" letter-spacing="0.2" fill="#6E6A62">LOCAL LIQUOR · DANMARK · EST. 2023</text>
  <text x="6" y="94.6" font-family="Archivo, 'Archivo Black', Helvetica, Arial, sans-serif" font-weight="800" font-size="3" letter-spacing="-0.03" fill="#C0453C">LOCALLIQUOR.DK</text>
  <text x="61.7" y="94.6" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="1.8" letter-spacing="0.22" fill="#9A958C">18+</text>
</svg>